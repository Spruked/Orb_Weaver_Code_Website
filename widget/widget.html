<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self';" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
      overflow: hidden;
      -webkit-app-region: drag;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #card {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 16px;
      border-radius: 8px;
      background: rgba(10, 14, 18, 0.94);
      border: 1px solid rgba(84, 214, 185, 0.32);
      color: #e8f4f2;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
    }

    .row,
    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .title {
      font-weight: 800;
      font-size: 13px;
      text-transform: uppercase;
      color: #9eb2af;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #64748b;
      -webkit-app-region: no-drag;
    }

    .dot.ok { background: #54d6b9; }
    .dot.warn { background: #f6c453; }
    .dot.err { background: #ff6b63; }

    .window-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .icon-btn {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: #9eb2af;
      border-radius: 6px;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }

    .icon-btn:hover {
      color: #e8f4f2;
      border-color: rgba(84, 214, 185, 0.35);
      background: rgba(84, 214, 185, 0.12);
    }

    .icon-btn.danger:hover {
      color: #fff;
      border-color: rgba(255, 107, 99, 0.55);
      background: rgba(255, 107, 99, 0.22);
    }

    .metric-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .metric {
      min-width: 0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px;
    }

    .metric .label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: #748783;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric .value {
      margin-top: 2px;
      font-size: 28px;
      line-height: 1;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .metric .value.warn { color: #f6c453; }
    .metric .value.danger { color: #ff6b63; }

    .bar {
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin-top: 9px;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: #54d6b9;
      transition: width 160ms ease;
    }

    #lastUpdated {
      min-width: 0;
      color: #748783;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #lastUpdated.limit { color: #ff8e87; font-weight: 700; }

    #openBtn {
      -webkit-app-region: no-drag;
      background: rgba(84, 214, 185, 0.12);
      border: 1px solid rgba(84, 214, 185, 0.34);
      color: #d9fffa;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      padding: 6px 9px;
      cursor: pointer;
    }

    #openBtn:hover { background: rgba(84, 214, 185, 0.2); }
  </style>
</head>
<body>
  <div id="card">
    <div class="topline">
      <span class="title">Session Monitor</span>
      <div class="window-actions">
        <span id="statusDot" class="dot" title="Connection status"></span>
        <button id="hideBtn" class="icon-btn" title="Hide widget" aria-label="Hide widget">-</button>
        <button id="quitBtn" class="icon-btn danger" title="Quit widget" aria-label="Quit widget">x</button>
      </div>
    </div>

    <div class="metric-row">
      <div class="metric">
        <div id="primaryLabel" class="label">5-Hour Limit · Used</div>
        <div id="primaryValue" class="value">--</div>
        <div class="bar"><div id="primaryBar" class="bar-fill"></div></div>
      </div>
      <div class="metric">
        <div id="secondaryLabel" class="label">Weekly Limit · Used</div>
        <div id="secondaryValue" class="value">--</div>
        <div class="bar"><div id="secondaryBar" class="bar-fill"></div></div>
      </div>
    </div>

    <div class="row">
      <span id="lastUpdated">not connected</span>
      <button id="openBtn">Dashboard</button>
    </div>
  </div>

  <script>
    const statusDot = document.getElementById("statusDot");
    const primaryLabel = document.getElementById("primaryLabel");
    const secondaryLabel = document.getElementById("secondaryLabel");
    const primaryValue = document.getElementById("primaryValue");
    const secondaryValue = document.getElementById("secondaryValue");
    const primaryBar = document.getElementById("primaryBar");
    const secondaryBar = document.getElementById("secondaryBar");
    const lastUpdated = document.getElementById("lastUpdated");
    const openBtn = document.getElementById("openBtn");
    const hideBtn = document.getElementById("hideBtn");
    const quitBtn = document.getElementById("quitBtn");

    openBtn.addEventListener("click", () => window.widgetBridge.openDashboard());
    hideBtn.addEventListener("click", () => window.widgetBridge.hideWidget());
    quitBtn.addEventListener("click", () => window.widgetBridge.quitApp());

    function setBarColor(el, valueEl, pct) {
      let color = "#54d6b9";
      let cls = "";
      if (pct >= 90) {
        color = "#ff6b63";
        cls = "danger";
      } else if (pct >= 75) {
        color = "#f6c453";
        cls = "warn";
      }
      el.style.background = color;
      valueEl.className = "value " + cls;
    }

    function applyPercent(valueEl, barEl, raw) {
      const pct = Number(raw);
      if (!Number.isFinite(pct)) {
        valueEl.textContent = "?";
        valueEl.className = "value";
        barEl.style.width = "0%";
        return;
      }
      valueEl.textContent = `${pct}%`;
      barEl.style.width = `${Math.min(100, Math.max(0, pct))}%`;
      setBarColor(barEl, valueEl, pct);
    }

    function describePlanLimit(windowData, fallback) {
      const minutes = Number(windowData?.window_minutes);
      if (!Number.isFinite(minutes)) return fallback;
      if (minutes === 300) return "5-Hour Limit · Used";
      if (minutes === 10080) return "Weekly Limit · Used";
      return `${fallback} · ${minutes}m window`;
    }

    function hasCurrentLimit(summary) {
      const limitEvent = summary.timeline?.latest_limit_event;
      if (!limitEvent?.timestamp) return false;
      const quotaTime = summary.quota?.evidence_timestamp || summary.quota?.observed_at;
      if (!quotaTime) return true;
      return Date.parse(limitEvent.timestamp) >= Date.parse(quotaTime);
    }

    async function poll() {
      const summary = await window.widgetBridge.getMonitorSummary();
      lastUpdated.className = "";
      if (!summary.ok) {
        statusDot.className = "dot err";
        primaryValue.textContent = "--";
        secondaryValue.textContent = "--";
        primaryBar.style.width = "0%";
        secondaryBar.style.width = "0%";
        lastUpdated.textContent = "monitor API unreachable";
        return;
      }

      const quota = summary.quota || {};
      const rateLimits = summary.timeline?.latest_rate_limits || {};
      primaryLabel.textContent = describePlanLimit(rateLimits.primary, "5-Hour Limit · Used");
      secondaryLabel.textContent = describePlanLimit(rateLimits.secondary, "Weekly Limit · Used");

      if (quota.status === "unknown") {
        statusDot.className = "dot warn";
        primaryValue.textContent = "?";
        secondaryValue.textContent = "?";
        lastUpdated.textContent = "quota unavailable";
        return;
      }

      applyPercent(primaryValue, primaryBar, quota.primary_used_percent);
      applyPercent(secondaryValue, secondaryBar, quota.secondary_used_percent);

      if (hasCurrentLimit(summary)) {
        statusDot.className = "dot err";
        lastUpdated.className = "limit";
        lastUpdated.textContent = "USAGE LIMIT REACHED · see dashboard";
      } else {
        statusDot.className = "dot ok";
        lastUpdated.textContent = `observed ${new Date(summary.observedAt).toLocaleTimeString()}`;
      }
    }

    async function startPolling() {
      const settings = await window.widgetBridge.getSettings();
      poll();
      setInterval(poll, settings.pollIntervalMs || 5000);
    }

    startPolling();
  </script>
</body>
</html>
